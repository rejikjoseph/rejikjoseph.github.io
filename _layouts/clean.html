---
layout: default
---
{% comment %} Single centred column (al-folio style), used by all pages of this site. {% endcomment %}
<div id="main" role="main" class="clean-main">
  <article class="clean-page">
    {% unless page.hide_title %}<h1 class="page__title">{{ page.title }}</h1>{% endunless %}
    {% if page.subtitle %}<p class="page__subtitle">{{ page.subtitle }}</p>{% endif %}
    {{ content }}
  </article>
</div>
